<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding club</title>
    <link rel ="stylesheet" href ="form.css">
</head>
<body>
    <!-- header -->
     <header class ="header">
        <h1> Coding club</h1>
        <p>learn. build. share</p>
     </header>

     <!-- header section-->
      <section class ="card">
        <h2>Upcoming Events</h2>
      </section>
      <table>
        <thead>
            <tr>
                <th> Events </th>
                <th> date </th>
                <th> Venue </th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>HTML Workshop</td>
                <td>12 Nov</td>
                <td>lab 1</td>
            </tr>
        </tbody>

        <tbody>
            <tr>
                <td>Hackathon</td>
                <td>20 Nov</td>
                <td>Seminar hall</td>
            </tr>
        </tbody>
      </table>
    </section>

    <!-- Registration section -->
     <section class ="card">
        <h2>Register</h2>

        <form>
            <div class ="form-row">
                <label for ="name">Name:</label>
                <input type ="text" id ="name" placeholder ="Your name" required>
            </div>

            <div class ="form row">
                <label for ="email">Email:</label>
                <input type ="email" id ="email" placeholder ="you@example.com" required>
            </div>
            <br>
            <button type = "register"> Register</button>
        </form>
     </section>
</body>
</html>
